interface:
  display_name: "Canvas2Note"
  short_description: "同步 Canvas 课件到 OneDrive，生成支持从零学习、带原生图文排版的 Notation 笔记"
  default_prompt: "使用 $canvas2note 将本学期 Canvas 课件归档到 OneDrive，并将笔记发布到 Notation；笔记必须能替代课件、支持从零学习，先解释概念再使用，逐页核对内容，所有代码配真实且无额外标题说明的效果图；结合可用已归档试卷编排深度但不透露考点，验证 Notation 图文布局，归档后清理本次临时下载。"
policy:
  allow_implicit_invocation: true
