interface:
  display_name: "Canvas2Note"
  short_description: "归档 Canvas 课件，保留 Poe 原文并单独配图发布到 Notation"
  default_prompt: "使用 $canvas2note 将本学期 Canvas 课件归档到 OneDrive；新笔记只把课件 PDF 附件发给 Poe NoteTakerShenxu，不附提示词；收到笔记后原样保留正文与已有格式，把课件图和已验证的代码效果图单独配入 Notation，验证图文布局并清理本次临时下载。"
policy:
  allow_implicit_invocation: true
