interface:
  display_name: "Canvas2Note"
  short_description: "归档 Canvas 课件，经 Poe 起草并配图、补高亮后发布到 Notation"
  default_prompt: "使用 $canvas2note 将本学期 Canvas 课件归档到 OneDrive；新笔记只把课件 PDF 附件发给 Poe NoteTakerShenxu，不附提示词，逐页复核、补解释、配图和行内高亮后发布到 Notation，支持从零学习。结合可用已归档试卷安排讲解深度但不透露考点；所有代码配真实且无额外标题说明的效果图，验证图文布局并清理本次临时下载。"
policy:
  allow_implicit_invocation: true
